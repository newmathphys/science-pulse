project:
  name: "SCM"
  full_name: "Scientific Content Machine"
  paradigm: "scm"
  owner_role: "chief_operator"
  ai_role: "tool"
  docs: "docs/INDEX.md"

# Science Pulse — рабочая конфигурация.
# Секреты сюда не пишем: они берутся из .env или GitHub Secrets.

schedule: ["09:00", "13:00", "17:00", "21:00"]
timezone: "Europe/Moscow"

# 4-уровневый календарь (см. docs/SCHEDULE.md): слот суток → дисциплина.
schedule_slots:
  "09:00": math
  "13:00": cs
  "17:00": physics
  "21:00": satellite_lab

# Медиа-гигиена: сколько свежих файлов держать в data/<каталог> (месячная уборка).
media:
  keep_last: 30

domains: ["math", "physics", "cs"]
max_queue: 80
# Если готовых постов меньше этого порога — пайплайн сам дозаказывает harvest.
low_water: 9
harvest_per_source: 2
translate: true

# Светофор автономности (/doctor): ожидаемый темп публикаций.
doctor:
  posts_per_day: 4

# Радар мировых новостей (/trending): Hacker News + GitHub + Reddit.
# auto_enqueue_min_likes: при harvest самому добавлять хиты с таким числом лайков (0 = выкл).
signal_engine:
  enabled: true
  reading_words_per_second: 3.2
  formula_penalty_seconds: 1.5
  code_line_penalty_seconds: 1.2
  min_entropy_bits: 1.8
  max_redundancy: 0.92
  p_fa: 0.05
  guard_hours: 4.0
  enforce: false
  auto_visual: true
  auto_visual_ratio: 1.8
  trending_filter: true
  kalman:
    alpha: 0.3
    process_noise: 0.01
    measurement_noise: 0.1
  uos:
    drop_ratio: 0.8
    recover_ratio: 1.2
    baseline_alpha: 0.2
  channels:
    telegram: 8.5
    threads: 4.2
    bluesky: 2.5
    discord: 16.0
    mastodon: 4.2
    vk: 32.0

trending:
  enabled: true
  top: 5
  auto_enqueue_min_likes: 0
  # «Молния науки»: при превышении порога лайков хит выходит внеочередным
  # спецвыпуском (0 = выключено; см. docs/SCHEDULE.md).
  auto_publish_min_likes: 350

# A/B стилей карточки: classic (обычный) / compact (плотнее, без крючка).
# Вариант выбирается детерминированно по id поста; результат пишется в meta.
growth:
  threads:
    enabled: true
    max_chars: 480
    utm: true

abtest:
  enabled: false
  variants: ["classic", "compact"]

# Озвучка постов: голосовое сообщение (OGG/OPUS) или аудио-подкаст (MP3).
# Адаптивная цепочка: edge (онлайн, Светлана) → piper (офлайн) →
# google_tts → espeak-ng → сонификация. Облачные движки при лимите уходят
# в cooldown и возвращаются автоматически.
voice:
  enabled: true
  engine: "auto"                  # auto | edge | piper | google_tts | espeak
  voice: "ru-RU-SvetlanaNeural"   # проверенный рабочий русский голос
  rate: "+0%"
  max_chars: 750                  # ≈55 секунд речи
  publish: "voice"                # voice (OGG/OPUS) | audio (MP3-подкаст)
  piper_model: "data/piper/ru_RU-dmitri-medium.onnx"  # офлайн-резерв
  piper_voice: "dmitri"           # dmitri | irina
  # Автоцепочка: edge → piper → google_tts → espeak → sonification.
  # Если облачный движок упёрся в лимит, он уходит в cooldown и возвращается
  # автоматически после паузы; остальные движки продолжают работу.
  priority: ["edge", "piper", "google_tts", "espeak", "sonification"]
  edge:
    failure_threshold: 2
    cooldown_minutes: 60
    max_cooldown_minutes: 360
  google:
    failure_threshold: 1
    cooldown_minutes: 120
    max_cooldown_minutes: 360
  espeak:
    enabled: true
    voice: "ru"
    speed: 150
  # Резервный Google TTS: бесплатный, включается после edge/piper.
  google_fallback: true

# Озвученные микро-видео: оживший чертёж + сонификация формулы (ffmpeg).
# Выходят каждый N-й пост (или принудительно: publish --video, /force video).
video:
  enabled: true
  every_nth_post: 3
  seconds: 3.6
  frames: 30
  with_sound: true

# Правила площадок (переопределение лимитов и звука без правок кода).
# Приоритет: kv (команда /limits set) → этот блок → значения по умолчанию.
# audio_mode: auto | voice | audio | mp4 | file | link | off
platform_rules:
  # threads:
  #   max_caption_chars: 600
  # telegram:
  #   audio_mode: audio

# Edge/D1 как основной источник (Hybrid D1-Primary):
# при true и заданных CF_WORKER_URL + INGEST_SECRET пайплайн делает pull
# (CRDT-слияние снимка D1) перед работой и push после.
edge:
  d1_primary: false

# Живые датчики Планеты и Космоса (без ключей и регистрации): USGS Earthquakes,
# NOAA SWPC (Kp-индекс), LIGO GWOSC (массы слияния), WhereTheISS.at (орбита МКС).
# Реальное сегодняшнее число подставляется в формулу поста — см. docs/LIVE_SENSORS.md.
live_sensors:
  enabled: true

# Пять режимов подачи (психология ленты): «Задача» выходит дозированно,
# а основная масса постов — чистое знание. См. docs/POST_MODES.md.
post_modes:
  enabled: true
  # Задача выпуска выходит дозированно: каждый 4-й пост, чтобы не утомлять ленту.
  challenge_every_nth: 4
  weights:
    pure_knowledge: 6
    satellite_lab: 2
    cheatsheet_save: 1
    moku3d_film: 1
    interactive_challenge: 1

# Пред-подготовка следующего выпуска (N+1 warm staging): сразу после успешной
# публикации пайплайн готовит лонгрид, паспорт, карточку и приёмку следующего
# поста. Отключите, если не нужны лишние секунды на публикацию.
staging:
  auto: true

# Выбор дисциплины: round_robin (строгое чередование) или thompson (бандит).
# Thompson включён вместе с bandit.enabled: дисциплина выбирается сэмплированием
# Beta(a, b), а после каждой публикации пайплайн выдаёт награду
# (`sota.reward_domain`) — поэтому бандит реально обучается, а не «шумит».
# Пока статистика пуста (a = b = 2), порядок остаётся равновероятным.
selection: "thompson"
bandit:
  enabled: true
# Гейт Хоукса: не даёт «перегреть» ленту. После публикации следующая ждёт, пока
# остаточная волна затухнет (<= eps) или пройдёт 6 часов. Отказ гейта — это
# ОТЛОЖЕНИЕ, а не ошибка: `cli run`/`cli publish` возвращают 0 (CI не падает,
# ложных алертов нет), `--force` гейт обходит.
hawkes:
  enabled: true
  beta_per_hour: 0.38
  eps: 0.45

# Адрес сайта (GitHub Pages / Cloudflare Pages). Нужен для ссылок в постах.
site_base_url: ""
site_title: "Science Pulse"

# Mini App «Пульт» (dist/pult.html) — операционное состояние проекта.
# По умолчанию НЕ публикуется на сайте: пульт только ваш (Telegram-бот).
# Включите осознанно, если страница доступна лишь вам (SP_MINIAPP_PUBLIC=1).
miniapp:
  public: false

data_dir: "data"
dist_dir: "dist"

# Сборка сайта: дорисовывать отсутствующие карточки (бессерверная живучесть —
# на чистой виртуальной машине GitHub Actions data/cards пуст).
site:
  render_missing_cards: true

card:
  size: 1080
  ssaa: 2
  # Дизайн выпуска: auto (умная A/B-ротация бандита) | academic (книга LaTeX) |
  # 3b1b (тёмный чертёж) | blueprint (инженерная миллиметровка) | moku3d (5-актовый фильм).
  # Оператор переключает на лету командой /theme в Пульта (приоритет у kv).
  theme: "auto"
  # Движок карточек: auto (meta-сигнал) | typst (3Blue1Brown) | academic (книжная серия) | pillow.
  engine: "auto"

# Moku3D: 5-актовый фильм, собранный из одного уравнения (docs/MOKU3D.md).
book_film:
  fps: 24
  size: 1080
  aspect: "1:1"
  max_frames: 1800

moku3d:
  size: 720             # сторона кадра (для 9:16 — ширина)
  aspect: "1:1"         # 1:1 (лента Telegram) | 9:16 (Reels/Shorts/VK Клипы)
  fps: 24
  seconds_per_act: 5.0  # × 5 актов = 30 секунд
  audio: true

sources:
  # Фундамент Науки: 30 узлов по ступеням — выходят первыми (см. curriculum.py).
  foundation:
    enabled: true
    weight: 70
  # Университетский курс: § 11.1 … § 55.3 (бесконечный поток после канона).
  curriculum:
    enabled: true
    weight: 40
  history_canon:
    enabled: false
    weight: 50
  stackexchange:
    enabled: true
    weight: 10
    sites:
      math:
        - ["math", "calculus"]
        - ["math", "linear-algebra"]
      physics:
        - ["physics", "quantum-mechanics"]
        - ["physics", "classical-mechanics"]
      cs:
        - ["cs", "algorithms"]
        - ["cstheory", "complexity-theory"]
  oeis:
    enabled: true
    weight: 8
  wikipedia:
    # Основной источник: понятные фундаментальные темы.
    enabled: true
    weight: 12
  arxiv:
    # Пониженный приоритет: узкие препринты неинтересны широкой аудитории.
    enabled: true
    weight: 1
  rosetta:
    enabled: true
    weight: 7
  github_raw:
    # Включайте только для проверенных raw-URL: README-списки дают мусорные посты.
    enabled: false
    weight: 5
    urls:
      - url: "https://raw.githubusercontent.com/Experience-Monks/math-as-code/master/README.md"
        domain: "math"
      - url: "https://raw.githubusercontent.com/brandonhimpfen/awesome-physics/master/README.md"
        domain: "physics"
      - url: "https://raw.githubusercontent.com/TheAlgorithms/Python/master/README.md"
        domain: "cs"
  numbers:
    # Публичный numbersapi.com в 2026 требует авторизацию и отдаёт 404/401.
    # Адаптер оставлен для совместимости; включайте при наличии рабочего эндпоинта.
    enabled: false
    weight: 3
  offline:
    enabled: true
    weight: 100

platforms:
  telegram: {enabled: true}
  threads: {enabled: true}
  bluesky: {enabled: true}
  discord: {enabled: true}
  mastodon: {enabled: true}
  vk: {enabled: true}

telegram:
  channel_id: ""
  admin_chat_id: ""
  message_thread_id: ""
  parse_mode: "HTML"
  # Нативная викторина в канале после публикации: задача выпуска уходит
  # опросом (sendPoll) в реплай к посту. Если в ответе нет числа — не отправляется.
  quiz_poll: true

threads:
  user_id: ""

mastodon:
  instance: "https://mathstodon.xyz"

vk:
  group_id: ""

admin:
  enabled: true
  poll_timeout: 25
  # Ставить нативное меню команд Telegram (setMyCommands) при старте пульта.
  set_commands: true

source_circuit:
  failures: 3
  open_minutes: 45
