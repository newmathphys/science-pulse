name: Platform Watch

on:
  schedule:
    # Каждый понедельник 10:00 МСК (07:00 UTC)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Считать всё изменённым"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: platform-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Watch APIs
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            python -m science_pulse.cli watch --send --force
          else
            python -m science_pulse.cli watch --send
          fi

      - name: Save watch state
        if: always()
        run: |
          git config user.name "science-pulse-bot"
          git config user.email "science-pulse-bot@users.noreply.github.com"
          git add data/platform_watch.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(platform-watch): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Состояние мониторинга не изменилось"
          fi
