name: Science Pulse

on:
  schedule:
    # 09:00, 13:00, 17:00 и 21:00 Europe/Moscow (06:00, 10:00, 14:00 и 18:00 UTC)
    - cron: "0 6,10,14,18 * * *"
  # Пуш в main: собираем сайт и публикуем его в ветку gh-pages (без публикации постов).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "Команда"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - harvest
          - publish
          - site
          - doctor
          - trending

permissions:
  contents: write

concurrency:
  group: science-pulse
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover

      - name: Lean toolchain (elan)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify formal invariants
        run: python -m science_pulse.cli formal

      - name: Init state
        run: python -m science_pulse.cli init

      - name: Process operator commands
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python -m science_pulse.cli admin --once

      - name: Auth check (read-only)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python -m science_pulse.cli auth-check

      - name: Run pipeline
        if: github.event_name != 'push'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_MESSAGE_THREAD_ID: ${{ secrets.TG_MESSAGE_THREAD_ID }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          STACKEXCHANGE_API_KEY: ${{ secrets.STACKEXCHANGE_API_KEY }}
          SP_SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SP_SITE_TITLE: Science Pulse
          SP_TRANSLATE: "1"
        run: |
          COMMAND="${{ github.event.inputs.command || 'run' }}"
          python -m science_pulse.cli "$COMMAND"

      - name: Prepare audiogram (MP4 для Threads)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SP_SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m science_pulse.cli attach-media --platform threads --prepare --latest 1

      - name: Render cards (картинки для сайта)
        continue-on-error: true
        run: python -m science_pulse.cli recard --dry-run

      - name: Build site
        run: python -m science_pulse.cli site

      - name: Check invariants
        run: python -m science_pulse.cli invariants

      - name: Autonomy doctor
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          SP_SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SP_TRANSLATE: "1"
        run: python -m science_pulse.cli doctor

      - name: Checkpoint WAL
        if: always()
        run: python -m science_pulse.cli checkpoint

      # Публикация статического сайта в ветку gh-pages
      # (GitHub Pages → Source: Deploy from a branch → gh-pages).
      - name: Publish site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "science-pulse-bot"
          git config user.email "science-pulse-bot@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "site: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Attach Threads video (звук в треде)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          SP_SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m science_pulse.cli attach-media --platform threads --latest 1

      - name: Backup state snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/science.db ]; then
            gzip -c data/science.db > data/state_backup.sqlite.gz
            gh release view state-backup >/dev/null 2>&1 || \
              gh release create state-backup --title "State backup" --notes "SQLite snapshot before D1-primary cutover" >/dev/null
            gh release upload state-backup data/state_backup.sqlite.gz --clobber
          else
            echo "Нет data/science.db для бэкапа"
          fi

      - name: Alert operator on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_ADMIN_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_ADMIN_CHAT_ID}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=⚠️ <b>Оператор!</b> Сбой автопилота Science Pulse (run ${{ github.run_id }}). Проверьте /doctor." \
              >/dev/null
          fi
