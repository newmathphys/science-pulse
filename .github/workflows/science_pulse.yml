name: Science Pulse

on:
  schedule:
    # 09:00, 14:00 и 19:00 Europe/Moscow (06:00, 11:00 и 16:00 UTC)
    - cron: "0 6,11,16 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Команда"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - harvest
          - publish
          - site
          - doctor
          - trending

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: science-pulse
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lean toolchain (elan)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify formal invariants
        run: python -m science_pulse.cli formal

      - name: Init state
        run: python -m science_pulse.cli init

      - name: Process operator commands
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python -m science_pulse.cli admin --once

      - name: Run pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_MESSAGE_THREAD_ID: ${{ secrets.TG_MESSAGE_THREAD_ID }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          STACKEXCHANGE_API_KEY: ${{ secrets.STACKEXCHANGE_API_KEY }}
          SP_SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SP_SITE_TITLE: Science Pulse
          SP_TRANSLATE: "1"
        run: |
          COMMAND="${{ github.event.inputs.command || 'run' }}"
          python -m science_pulse.cli "$COMMAND"

      - name: Build site
        run: python -m science_pulse.cli site

      - name: Check invariants
        run: python -m science_pulse.cli invariants

      - name: Autonomy doctor
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          SP_SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SP_TRANSLATE: "1"
        run: python -m science_pulse.cli doctor

      - name: Checkpoint WAL
        if: always()
        run: python -m science_pulse.cli checkpoint

      - name: Save state
        if: always()
        run: |
          git config user.name "science-pulse-bot"
          git config user.email "science-pulse-bot@users.noreply.github.com"
          git add data/science.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: science pulse state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Состояние не изменилось"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Alert operator on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_ADMIN_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_ADMIN_CHAT_ID}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=⚠️ <b>Оператор!</b> Сбой автопилота Science Pulse (run ${{ github.run_id }}). Проверьте /doctor." \
              >/dev/null
          fi
